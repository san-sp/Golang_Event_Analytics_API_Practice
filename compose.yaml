services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
    ports:
      - '127.0.0.1:27018:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - 'quit(db.adminCommand({ ping: 1 }).ok === 1 ? 0 : 1)'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: '8100'
      MONGODB_URI: ${PULSETRACK_DOCKER_MONGODB_URI:?Set PULSETRACK_DOCKER_MONGODB_URI in .env}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-pulsetrack}
    ports:
      - '127.0.0.1:8100:8100'
    depends_on:
      mongodb:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - api

  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - /config/alertmanager-entrypoint.sh
    environment:
      SMTP_FROM: ${ALERTMANAGER_SMTP_FROM:?Set ALERTMANAGER_SMTP_FROM in .env}
      SMTP_USERNAME: ${ALERTMANAGER_SMTP_USERNAME:?Set ALERTMANAGER_SMTP_USERNAME in .env}
      SMTP_PASSWORD: ${ALERTMANAGER_SMTP_PASSWORD:?Set ALERTMANAGER_SMTP_PASSWORD in .env}
      ALERT_EMAIL_TO: ${ALERTMANAGER_EMAIL_TO:?Set ALERTMANAGER_EMAIL_TO in .env}
    ports:
      - '127.0.0.1:9093:9093'
    volumes:
      - ./alertmanager-entrypoint.sh:/config/alertmanager-entrypoint.sh:ro
    depends_on:
      - prometheus

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mongodb_data:
  prometheus_data:
  grafana_data:
